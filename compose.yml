services:
  backend:
    container_name: bangkok_transit
    build:
      context: .
      args:
        VITE_API_BASE_URL: .
    restart: unless-stopped
    ports:
      - "7003:80"
    environment:
      - PYTHONPATH=/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
