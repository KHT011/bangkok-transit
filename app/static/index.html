<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangkok Transit Map</title>
</head>

<body>
    <h1>Bangkok Transit Map</h1>
    <p>Find the desired path between two stations.</p>
    <form action="/paths/" method="post">
        <label for="start_station_code">Start Station Code:</label>
        <input type="text" id="start_station_code" name="start_station_code">
        <label for="end_station_code">End Station Code:</label>
        <input type="text" id="end_station_code" name="end_station_code">
        <label for="criteria">Criteria:</label>
        <select name="criteria" id="criteria">
            <option value="shortest">Shortest</option>
            <option value="cheapest">Cheapest</option>
            <option value="all">All</option>
        </select>
        <button type="submit">Find Path</button>
    </form>

    <div id="result">
        <p>Path steps:</p>
        <ul id="path_steps"></ul>
        <p>Stations:</p>
        <ul id="stations"></ul>
        <p>Fare breakdown:</p>
        <ul id="fare_breakdown"></ul>
        <p>Total fare:</p>
        <p id="total_fare"></p>
    </div>


    <script>
        document.querySelector('form').addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = {};
            for (const [key, value] of formData.entries()) {
                data[key] = value;
            }
            fetch('/paths/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(data => {
                    document.querySelector('#path_steps').innerHTML = '';
                    data.data.route_steps.forEach(step => {
                        const li = document.createElement('li');
                        li.textContent = `${step.icon} ${step.action} ${step.station.code} ${step.station.name}`;
                        document.querySelector('#path_steps').appendChild(li);
                    });
                    document.querySelector('#stations').innerHTML = '';
                    data.data.stations.forEach(station => {
                        const li = document.createElement('li');
                        li.textContent = `${station.station_code}`;
                        document.querySelector('#stations').appendChild(li);
                    });
                    document.querySelector('#fare_breakdown').innerHTML = '';
                    data.data.fare_breakdown.forEach(fare => {
                        const li = document.createElement('li');
                        li.textContent = `${fare.agency} - ${fare.ride_hops} hops - ${fare.cost}`;
                        document.querySelector('#fare_breakdown').appendChild(li);
                    });
                    document.querySelector('#total_fare').textContent = data.data.fare_total;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });
    </script>
</body>

</html>
